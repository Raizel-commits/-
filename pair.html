<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAIZEL XMD • Pairing Code</title>

<style>
:root{
 --glass:rgba(255,255,255,.10);
 --primary:#1db954;
 --secondary:#9333ea;
 --text:#fff;
 --muted:#b3b3b3;
}

*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto}
body{margin:0;background:#000;color:var(--text);overflow:hidden}

canvas{position:fixed;inset:0;z-index:-2}
.overlay{
 position:fixed;inset:0;z-index:-1;
 background:
 radial-gradient(circle at 30% 30%,#1db95430,transparent 40%),
 radial-gradient(circle at 70% 70%,#9333ea30,transparent 45%);
}

.app{max-width:480px;margin:auto;padding:30px 20px}
.logo{text-align:center;margin-bottom:25px}
.logo p{color:var(--muted)}

.card{
 background:var(--glass);
 backdrop-filter:blur(20px);
 border-radius:22px;
 padding:20px;
 margin-bottom:20px;
 border:1px solid rgba(255,255,255,.15);
}

label{font-size:12px;color:var(--muted)}
input{
 width:100%;padding:14px;border-radius:14px;border:none;
 background:#00000055;color:white;margin:8px 0 14px;
}

.btn{
 width:100%;padding:15px;border-radius:16px;
 background:linear-gradient(135deg,var(--primary),#22c55e);
 color:#000;font-weight:800;border:none;
}

.result{text-align:center;margin-top:14px;font-weight:700}
.code{font-size:26px;letter-spacing:6px;color:#22c55e}

.footer{text-align:center;font-size:12px;color:var(--muted)}
a{color:var(--primary);text-decoration:none}
</style>
</head>

<body>
<canvas id="bg"></canvas>
<div class="overlay"></div>

<div class="app">
 <div class="logo">
  <h1>RAIZEL XMD</h1>
  <p>Connexion WhatsApp par Pairing Code</p>
 </div>

 <div class="card">
  <p>1️⃣ Numéro WhatsApp (sans +)</p>
  <p>2️⃣ Générer le code</p>
  <p>3️⃣ WhatsApp → Appareils liés</p>
  <p>4️⃣ Entrer le code</p>
 </div>

 <div class="card">
  <label>Numéro WhatsApp</label>
  <input id="phone" placeholder="2376XXXXXXX">
  <label>Nom du bot</label>
  <input id="user" placeholder="raizelbot">
  <button class="btn" id="gen">GÉNÉRER</button>
  <div class="result" id="res"></div>
 </div>

 <div class="footer">
  © 2025 RAIZEL XMD • <a href="https://t.me/devraizel">Telegram</a>
 </div>
</div>

<script>
const canvas=document.getElementById("bg"),ctx=canvas.getContext("2d");
let w,h,p=[];
function r(){w=canvas.width=innerWidth;h=canvas.height=innerHeight}
r();onresize=r;
for(let i=0;i<40;i++)p.push({x:Math.random()*w,y:Math.random()*h,dx:(Math.random()-.5),dy:(Math.random()-.5)});
function a(){
 ctx.clearRect(0,0,w,h);
 p.forEach(e=>{
  e.x+=e.dx;e.y+=e.dy;
  if(e.x<0||e.x>w)e.dx*=-1;
  if(e.y<0||e.y>h)e.dy*=-1;
  ctx.fillStyle="rgba(29,185,84,.5)";
  ctx.beginPath();ctx.arc(e.x,e.y,3,0,Math.PI*2);ctx.fill();
 });
 requestAnimationFrame(a);
}a();
addEventListener("pointerdown",()=>p.forEach(e=>{e.dx*=2;e.dy*=2}));

document.getElementById("gen").onclick=async()=>{
 const phone=phone.value.trim(),res=document.getElementById("res");
 if(!phone){res.innerHTML="❌ Numéro manquant";return}
 res.innerHTML="⏳ Génération...";
 const r=await fetch(`/code?number=${phone}`);
 const d=await r.json();
 res.innerHTML=d.code?`<div class="code">${d.code}</div>`:"❌ Erreur";
};
</script>
</body>
</html>
