<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="/styles.css">
  <title>Secret Story</title>
</head>
<body>
  <div class="container">
    <h1>Secret Story</h1>
    <h2>Créer ton lien anonyme</h2>
    <input id="u" placeholder="Nom d'utilisateur" />
    <button onclick="create()">Créer</button>
    <p id="result"></p>
  </div>

  <script>
    async function create() {
      const r = await fetch("/api/create", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: u.value })
      });
      const d = await r.json();
      result.innerHTML = `Lien: <a style="color:#ff4081" href="/u/${d.username}">/u/${d.username}</a><br>Token inbox: ${d.inboxToken}`;
    }
  </script>
</body>
</html>
