<!DOCTYPE html>
<html>
<head>
  <title>Secret Story - Login / Register</title>
  <style>
    @keyframes gradient {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(270deg, #ff4081, #7c4dff, #18ffff);
      background-size: 600% 600%;
      animation: gradient 20s ease infinite;
      color: #fff;
      text-align: center;
    }

    .container {
      background-color: rgba(0,0,0,0.7);
      padding: 50px;
      border-radius: 20px;
      width: 90%;
      max-width: 500px;
    }

    h1 { font-size: 3.5em; margin-bottom: 30px; color: #ff4081; }
    h2 { font-size: 2em; margin-bottom: 20px; color: #18ffff; }

    input { font-size: 1.5em; padding: 15px; margin: 10px 0; width: 80%; border-radius: 10px; border: none; text-align: center; background:#222; color:#fff; }
    button { font-size: 1.5em; padding: 15px 30px; margin: 10px; border-radius: 10px; border:none; background:#ff4081; color:#fff; cursor:pointer; transition:0.3s; }
    button:hover { background:#e91e63; }

    .section { margin-bottom: 40px; border-top: 1px solid #444; padding-top: 30px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Secret Story</h1>

    <!-- REGISTER -->
    <div class="section">
      <h2>Créer un compte</h2>
      <input id="regEmail" placeholder="Email"><br>
      <input id="regUsername" placeholder="Username"><br>
      <input id="regPassword" type="password" placeholder="Password"><br>
      <button onclick="register()">S'inscrire</button>
    </div>

    <!-- LOGIN -->
    <div class="section">
      <h2>Connexion</h2>
      <input id="loginEmail" placeholder="Email"><br>
      <input id="loginPassword" type="password" placeholder="Password"><br>
      <button onclick="login()">Se connecter</button>
    </div>
  </div>

  <script>
    async function register() {
      const email = document.getElementById("regEmail").value;
      const username = document.getElementById("regUsername").value;
      const password = document.getElementById("regPassword").value;
      if(!email || !username || !password) return alert("Veuillez remplir tous les champs");

      const res = await fetch("/api/register", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ email, username, password })
      });
      const data = await res.json();
      if(data.error) return alert(data.error);
      alert("Compte créé avec succès !");
    }

    async function login() {
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;
      if(!email || !password) return alert("Veuillez remplir tous les champs");

      const res = await fetch("/api/login", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if(data.error) return alert(data.error);

      localStorage.token = data.token;
      localStorage.username = data.username;
      location = "/dashboard";
    }
  </script>
</body>
</html>
