<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>RAIZEL XMD • Pairing</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0b0b14;
  --card: rgba(25, 25, 40, .75);
  --primary: #8b5cf6;
  --primary-glow: #a78bfa;
  --text: #fff;
  --muted: #9ca3af;
}

* { box-sizing: border-box; font-family: 'Inter', sans-serif; }

body {
  margin: 0;
  background: radial-gradient(circle at top, #1a1440, var(--bg));
  color: var(--text);
  overflow-x: hidden;
}

/* 🌌 animated background */
.bg {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 20% 20%, #8b5cf630, transparent 40%),
    radial-gradient(circle at 80% 80%, #6366f130, transparent 40%);
  animation: bgMove 10s infinite alternate;
  z-index: 0;
}
@keyframes bgMove {
  from { filter: hue-rotate(0deg); }
  to { filter: hue-rotate(25deg); }
}

.app {
  position: relative;
  z-index: 1;
  max-width: 420px;
  margin: auto;
  padding: 20px;
}

/* 🔷 header */
.logo {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin: 30px 0;
}
.logo .icon {
  width: 64px;
  height: 64px;
  border-radius: 20px;
  background: linear-gradient(135deg, var(--primary), var(--primary-glow));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  box-shadow: 0 0 30px var(--primary);
}
.logo h1 {
  margin: 14px 0 4px;
  letter-spacing: 1px;
}
.logo p {
  color: var(--muted);
  font-size: 14px;
}

/* 🧊 card */
.card {
  background: var(--card);
  backdrop-filter: blur(16px);
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 20px;
  border: 1px solid rgba(255,255,255,.08);
  animation: fadeUp .8s ease;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ℹ️ how */
.how li {
  font-size: 14px;
  color: var(--muted);
  margin-bottom: 8px;
}

/* ✏️ inputs */
label {
  font-size: 12px;
  color: var(--muted);
}
input {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  margin-top: 6px;
  margin-bottom: 14px;
  background: #0f0f1e;
  color: white;
  outline: none;
}

/* 🔘 buttons */
.btn {
  width: 100%;
  padding: 14px;
  border-radius: 14px;
  border: none;
  background: linear-gradient(135deg, var(--primary), var(--primary-glow));
  color: white;
  font-weight: 700;
  letter-spacing: .5px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  box-shadow: 0 0 20px #8b5cf660;
}
.btn:active {
  transform: scale(.97);
}

/* ripple */
.btn span {
  position: absolute;
  border-radius: 50%;
  transform: scale(0);
  animation: ripple .6s linear;
  background: rgba(255,255,255,.6);
}
@keyframes ripple {
  to { transform: scale(4); opacity: 0; }
}

.switch {
  display: flex;
  gap: 10px;
}
.switch button {
  flex: 1;
  background: #15152a;
  border-radius: 12px;
  padding: 12px;
  border: none;
  color: white;
}
.switch .active {
  background: var(--primary);
}

/* 📦 result */
.result {
  text-align: center;
  margin-top: 14px;
}
.code {
  font-size: 26px;
  letter-spacing: 6px;
  color: #22c55e;
}
img {
  max-width: 220px;
}
</style>
</head>

<body>
<div class="bg"></div>

<div class="app">

  <div class="logo">
    <div class="icon">Σ</div>
    <h1>RAIZEL-XMD</h1>
    <p>Déployez votre bot WhatsApp</p>
  </div>

  <div class="card">
    <b>💡 Comment ça marche</b>
    <ol class="how">
      <li>Entrez votre numéro WhatsApp</li>
      <li>Choisissez un nom</li>
      <li>Générez le code</li>
      <li>WhatsApp → Appareils liés</li>
      <li>Entrez le code affiché</li>
    </ol>
  </div>

  <div class="card">
    <label>Numéro WhatsApp</label>
    <input id="phone" placeholder="2376xxxxxxx">

    <label>Nom d’utilisateur</label>
    <input id="username" placeholder="monbot">

    <div class="switch">
      <button class="active" onclick="mode='pairing'">🔑 Pairing</button>
      <button onclick="mode='qr'">📸 QR</button>
    </div>

    <button class="btn" onclick="generate(event)">GÉNÉRER</button>

    <div class="result" id="result"></div>
  </div>

</div>

<script>
let mode = 'pairing'

function ripple(e) {
  const btn = e.currentTarget
  const circle = document.createElement("span")
  const d = Math.max(btn.clientWidth, btn.clientHeight)
  circle.style.width = circle.style.height = d + "px"
  circle.style.left = e.offsetX - d / 2 + "px"
  circle.style.top = e.offsetY - d / 2 + "px"
  btn.appendChild(circle)
  setTimeout(() => circle.remove(), 600)
}

async function generate(e) {
  ripple(e)
  const phone = phone.value
  const username = username.value
  const result = document.getElementById('result')
  result.innerHTML = '⏳ Chargement...'

  const res = await fetch('/' + mode, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ phone, username })
  })
  const data = await res.json()

  if (data.code) {
    result.innerHTML = `<div class="code">${data.code}</div>`
  } else if (data.qr) {
    result.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(data.qr)}">`
  } else {
    result.innerHTML = data.status || data.error
  }
}
</script>

</body>
</html>
