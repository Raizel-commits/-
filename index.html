<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAIZEL-XMD • Dashboard</title>
<style>
:root { --bg:#0b0b14; --card:rgba(25,25,40,.75); --primary:#8b5cf6; --primary-glow:#a78bfa; --text:#fff; --muted:#9ca3af; }
* { box-sizing:border-box; font-family:Inter,sans-serif; margin:0; padding:0; }
body { background:radial-gradient(circle at top,#1a1440,var(--bg)); color:var(--text); overflow-x:hidden; }
.bg { position:fixed; inset:0; background:radial-gradient(circle at 20% 20%,#8b5cf630,transparent 40%),radial-gradient(circle at 80% 80%,#6366f130,transparent 40%); animation:bgMove 10s infinite alternate; z-index:0; }
@keyframes bgMove { from{filter:hue-rotate(0deg);} to{filter:hue-rotate(25deg);} }
.app { position:relative; z-index:1; max-width:480px; margin:auto; padding:30px; text-align:center; }
.logo { margin-bottom:30px; }
.logo .icon { width:64px; height:64px; border-radius:20px; background:linear-gradient(135deg,var(--primary),var(--primary-glow)); display:inline-flex; align-items:center; justify-content:center; font-size:28px; box-shadow:0 0 30px var(--primary); }
.logo h1 { margin:14px 0 6px; }
.logo p { color:var(--muted); font-size:14px; }
.card { background:var(--card); backdrop-filter:blur(16px); border-radius:18px; padding:25px; margin-bottom:20px; border:1px solid rgba(255,255,255,.08); }
.btn { display:inline-block; margin:10px; padding:14px 28px; border:none; border-radius:14px; background:linear-gradient(135deg,var(--primary),var(--primary-glow)); color:#fff; font-weight:700; font-size:16px; cursor:pointer; transition:0.3s; text-decoration:none; }
.btn:hover { transform:scale(1.05); box-shadow:0 0 25px var(--primary-glow); }
</style>
</head>
<body>
<div class="bg"></div>
<div class="app">
  <div class="logo">
    <div class="icon">Σ</div>
    <h1>RAIZEL-XMD</h1>
    <p>WhatsApp Multi-Bot Dashboard</p>
  </div>
  <div class="card">
    <h2>Actions</h2>
    <a href="/pair" class="btn">Générer Pairing Code</a>
    <a href="/qrpage" class="btn">Scanner QR Code</a>
  </div>
  <div class="card">
    <h2>Informations</h2>
    <p>✅ Multi-bot compatible</p>
    <p>🚀 Chargement rapide</p>
    <p>🎛️ Commands intégrées automatiquement</p>
  </div>
</div>
</body>
</html>
