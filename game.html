<!DOCTYPE html>
<html>
<head>
  <title>2Dé</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="top">
  <span>💰 <b id="balance">0</b> FCFA</span>
  <button class="plus">＋</button>
</div>

<h3>Choisissez votre cote</h3>

<div class="cards">
  <div class="card" id="plus" onclick="select('plus')">Plus de 7<br>x2.3</div>
  <div class="card" id="egal" onclick="select('egal')">Égal 7<br>x5.8</div>
  <div class="card" id="moins" onclick="select('moins')">Moins de 7<br>x2.3</div>
</div>

<div class="bet-box">
  <button onclick="min()">MIN</button>
  <button onclick="x2()">X2</button>
  <button onclick="half()">X/2</button>
  <button onclick="max()">MAX</button>
</div>

<p>Mise : <span id="bet">50</span> FCFA</p>

<button class="play" onclick="play()">▶ JOUER</button>

<div class="dice">
  <div id="d1">🎲</div>
  <div id="d2">🎲</div>
</div>

<p id="result"></p>

<script src="script.js"></script>
</body>
</html>
