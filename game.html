<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Jeu de Dés</title>
<style>
:root{--bg-1:#040406;--bg-2:#071012;--card-w:380px;}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;font-family:Arial;background:linear-gradient(180deg,var(--bg-1),var(--bg-2));color:white;overflow:hidden;}
#particles{position:fixed;inset:0;width:100%;height:100%;z-index:0;}
.header{position:fixed;top:0;left:0;width:100%;padding:12px 16px;background:rgba(0,0,0,0.4);display:flex;justify-content:space-between;align-items:center;z-index:5;}
#balance{font-weight:bold;}
.menu-btn{font-size:24px;cursor:pointer;}
.menu{position:fixed;top:0;right:-260px;width:260px;height:100%;background:rgba(20,20,35,0.95);padding:20px;transition:0.3s;z-index:10;display:flex;flex-direction:column;gap:12px;}
.menu.active{right:0;}
.menu input{padding:10px;border-radius:8px;border:none;width:100%;}
.menu button{padding:10px;border-radius:8px;border:none;background:gold;color:black;font-weight:bold;cursor:pointer;}
.container{position:relative;top:60px;width:360px;margin:0 auto;background:rgba(255,255,255,0.03);border-radius:15px;padding:20px;box-shadow:0 0 30px rgba(0,0,0,0.7);}
.choice{width:100px;background:#2a2e4d;border-radius:12px;padding:10px;text-align:center;cursor:pointer;border:2px solid transparent;display:inline-block;margin:4px;}
.choice.active{border-color:gold;}
input#bet{width:100%;padding:12px;border-radius:10px;border:none;margin:10px 0;text-align:center;}
.play{width:100%;padding:14px;background:#4caf50;border:none;border-radius:12px;font-size:18px;color:white;cursor:pointer;}
.result{text-align:center;font-weight:bold;margin-top:10px;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.7);color:white;padding:12px 20px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity 0.3s, transform 0.3s;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-10px);}
</style>
</head>
<body>
<canvas id="particles"></canvas>

<div class="header">
  <div id="balance">💰 0 XAF</div>
  <div class="menu-btn" onclick="toggleMenu()">☰</div>
</div>

<div class="menu" id="menu">
  <h3>Dépôt / Retrait</h3>
  <input type="number" id="depositAmount" placeholder="Montant dépôt min 1000">
  <button onclick="deposit()">Déposer</button>
  <input type="number" id="withdrawAmount" placeholder="Montant retrait min = double dépôt">
  <button onclick="withdraw()">Retirer</button>
</div>

<div class="container">
  <h2>Choisissez votre pari</h2>
  <div class="choice" onclick="setChoice('moins')">Moins de 7</div>
  <div class="choice" onclick="setChoice('egal')">Égal 7</div>
  <div class="choice" onclick="setChoice('plus')">Plus de 7</div>
  <input type="number" id="bet" value="200" min="200" max="150000">
  <button class="play" onclick="play()">Lancer</button>
  <div class="result" id="result"></div>
</div>

<div id="toast" class="toast"></div>

<script>
let user = JSON.parse(localStorage.getItem("user")) || {balance:0, totalDeposit:0};
document.getElementById("balance").innerText = `💰 ${user.balance} XAF`;
let choice=null;
function toggleMenu(){document.getElementById("menu").classList.toggle("active");}
function setChoice(c){choice=c;document.querySelectorAll('.choice').forEach(el=>el.classList.remove('active'));event.target.closest('.choice').classList.add('active');}

function showToast(msg){
  const toast = document.getElementById("toast");
  toast.innerText = msg;
  toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"),2500);
}

// --- Particles animation ---
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth; canvas.height = window.innerHeight;
let particles=[];
for(let i=0;i<80;i++) particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*2+1,s:Math.random()*1.5});
function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let p of particles){
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,0.3)';
    ctx.fill();
    p.y-=p.s; if(p.y<0)p.y=canvas.height;
  }
  requestAnimationFrame(animate);
}
animate();

// --- Play ---
function play(){
  const bet = Number(document.getElementById("bet").value);
  if(!choice){showToast("Choisissez un pari"); return;}
  if(bet<200||bet>150000){showToast("Mise invalide");return;}
  if(bet>user.balance){showToast("Solde insuffisant");return;}
  
  fetch("/api/play",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({userId:user.id, bet, choice})
  }).then(r=>r.json()).then(d=>{
    if(d.error) return showToast(d.error);
    user.balance = d.balance;
    localStorage.setItem("user", JSON.stringify(user));
    document.getElementById("balance").innerText=`💰 ${user.balance} XAF`;
    showToast(d.win?"Gagné !":"Perdu !");
    document.getElementById("result").innerText=`🎲 ${d.d1}+${d.d2}=${d.sum}`;
  });
}

// --- Deposit ---
function deposit(){
  const amount = Number(document.getElementById("depositAmount").value);
  if(amount<1000){showToast("Montant minimum 1000 XAF");return;}
  fetch("/api/moneyfusion/deposit",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({userId:user.id,amount})
  }).then(r=>r.json()).then(d=>{
    if(d.error) return showToast(d.error);
    user.balance = d.balance;
    user.totalDeposit = (user.totalDeposit||0)+amount;
    localStorage.setItem("user",JSON.stringify(user));
    document.getElementById("balance").innerText = `💰 ${user.balance} XAF`;
    showToast("Dépôt effectué !");
  });
}

// --- Withdraw ---
function withdraw(){
  const amount = Number(document.getElementById("withdrawAmount").value);
  if(amount>user.balance){showToast("Solde insuffisant");return;}
  if(amount<user.totalDeposit*2){showToast(`Montant minimum retrait = double dépôt (${user.totalDeposit*2})`); return;}
  fetch("/api/moneyfusion/withdraw",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({userId:user.id,amount})
  }).then(r=>r.json()).then(d=>{
    if(d.error) return showToast(d.error);
    user.balance = d.balance;
    localStorage.setItem("user",JSON.stringify(user));
    document.getElementById("balance").innerText = `💰 ${user.balance} XAF`;
    showToast("Retrait effectué !");
  });
}
</script>
</body>
</html>
