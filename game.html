<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Jeu 2Dé</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h1>Bienvenue sur 2Dé</h1>
        <div id="userInfo"></div>
        <div id="balanceInfo"></div>
    </div>

    <div class="deposit-section">
        <h2>Faire un dépôt (min 1000f)</h2>
        <input type="number" id="depositAmount" placeholder="Montant">
        <button id="depositBtn">Déposer</button>
    </div>

    <div class="withdraw-section">
        <h2>Retirer de l’argent</h2>
        <input type="number" id="withdrawAmount" placeholder="Montant">
        <button id="withdrawBtn">Retirer</button>
    </div>

    <div class="game-board">
        <h2>Choisis ta case</h2>
        <div class="cases">
            <button class="case case1" data-case="1">1</button>
            <button class="case case2" data-case="2">2</button>
            <button class="case case3" data-case="3">3</button>
            <button class="case case4" data-case="4">4</button>
            <button class="case case5" data-case="5">5</button>
            <button class="case case6" data-case="6">6</button>
        </div>
        <div class="bet-section">
            <input type="number" id="betAmount" placeholder="Mise (min 50f)">
            <button id="playBtn">Jouer</button>
        </div>
    </div>

    <div id="result"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const user = urlParams.get('user');
        const userInfo = document.getElementById('userInfo');
        const balanceInfo = document.getElementById('balanceInfo');
        const resultDiv = document.getElementById('result');
        let selectedCase = null;
        let balance = 0;

        userInfo.innerHTML = `<strong>Utilisateur :</strong> ${user}`;

        function fetchBalance() {
            fetch(`/api/balance/${user}`)
                .then(res => res.json())
                .then(data => {
                    balance = data.balance;
                    balanceInfo.innerHTML = `<strong>Solde :</strong> ${balance}f`;
                });
        }

        fetchBalance();

        document.querySelectorAll('.case').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.case').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedCase = btn.getAttribute('data-case');
            });
        });

        document.getElementById('depositBtn').addEventListener('click', () => {
            const amount = parseInt(document.getElementById('depositAmount').value);
            fetch('/api/deposit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, amount })
            })
            .then(res => res.json())
            .then(data => {
                if(data.error) alert(data.error);
                else {
                    balance = data.balance;
                    balanceInfo.innerHTML = `<strong>Solde :</strong> ${balance}f`;
                }
            });
        });

        document.getElementById('withdrawBtn').addEventListener('click', () => {
            const amount = parseInt(document.getElementById('withdrawAmount').value);
            fetch('/api/withdraw', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, amount })
            })
            .then(res => res.json())
            .then(data => {
                if(data.error) alert(data.error);
                else {
                    balance = data.balance;
                    balanceInfo.innerHTML = `<strong>Solde :</strong> ${balance}f`;
                }
            });
        });

        document.getElementById('playBtn').addEventListener('click', () => {
            const bet = parseInt(document.getElementById('betAmount').value);
            if (!selectedCase) { alert("Sélectionne une case !"); return; }
            if (bet < 50) { alert("Mise minimale : 50f"); return; }
            if (bet > balance) { alert("Solde insuffisant !"); return; }

            fetch('/api/play', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, caseNumber: selectedCase, bet })
            })
            .then(res => res.json())
            .then(data => {
                if(data.error) alert(data.error);
                else {
                    balance = data.balance;
                    balanceInfo.innerHTML = `<strong>Solde :</strong> ${balance}f`;
                    resultDiv.innerHTML = data.message;
                }
            });
        });
    </script>
</body>
</html>
