<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Jeu de Dés</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
  --bg-1: #040406;
  --bg-2: #071012;
  --neon: #dfffe6;
  --glass-alpha: 0.12;
  --glass-border: rgba(223,255,230,0.18);
  --muted: rgba(255,255,255,0.45);
  --card-w: 380px;
}
*{box-sizing:border-box;}
html,body{
  height:100%;
  margin:0;
  font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;
  background: radial-gradient(1200px 600px at 10% 10%, rgba(223,255,230,0.03), transparent),
              radial-gradient(900px 500px at 90% 85%, rgba(223,255,230,0.02), transparent),
              linear-gradient(180deg,var(--bg-1),var(--bg-2));
  color:#dfffe6;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
}
#particles{position:fixed;inset:0;width:100%;height:100%;z-index:0;}
.header{
  position:fixed;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  font-weight:bold;
  font-size:16px;
  z-index:5;
}
.stage{
  position:relative;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:36px;
  z-index:1;
}
.glass-card{
  width:var(--card-w);max-width:92vw;
  background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
  border-radius:18px;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,0.7), 0 0 40px rgba(223,255,230,0.05) inset;
  backdrop-filter: blur(10px) saturate(140%);
  border:1px solid var(--glass-border);position:relative;overflow:hidden;text-align:center;
}
.title{font-family:"JetBrains Mono",monospace;font-size:16px;color:var(--neon);margin-bottom:12px;}
button{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:none;
  background:linear-gradient(180deg, rgba(223,255,230,0.06), rgba(223,255,230,0.02));
  color:var(--neon);
  font-family:"JetBrains Mono",monospace;
  font-size:16px;
  margin-top:12px;
  cursor:pointer;
}
input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid rgba(223,255,230,0.06);
  background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.006));
  color:#eafff2;
  margin-bottom:10px;
}
.result{margin-top:10px;font-weight:bold;}
.choices{display:flex;justify-content:space-between;margin-bottom:10px;}
.choice{
  width:32%;
  padding:10px;
  border-radius:10px;
  background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.006));
  cursor:pointer;
  text-align:center;
}
.choice.active{border:2px solid var(--neon);}
.menu-btn{
  position:absolute;top:14px;right:16px;font-size:22px;cursor:pointer;
}
.menu{
  position:fixed;top:0;right:-280px;width:260px;height:100%;
  background:rgba(20,20,35,0.95);padding:20px;
  transition:0.3s;z-index:10;display:flex;flex-direction:column;gap:12px;
}
.menu.active{right:0;}
.menu input{padding:10px;border-radius:8px;border:none;width:100%;}
.toast{
  position:fixed;bottom:20px;left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,0.7);
  color:white;padding:12px 20px;border-radius:8px;
  font-size:14px;opacity:0;pointer-events:none;
  transition:opacity 0.3s, transform 0.3s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-10px);}
</style>
</head>
<body>
<canvas id="particles"></canvas>
<div class="header">💰 <span id="balance">0</span> XAF</div>
<div class="menu-btn" onclick="toggleMenu()">☰</div>
<div class="menu" id="menu">
  <h3>Dépôt / Retrait</h3>
  <input type="number" id="depositAmount" placeholder="Montant dépôt min 1000">
  <button onclick="deposit()">Déposer</button>
  <input type="number" id="withdrawAmount" placeholder="Montant retrait min = double dépôt">
  <button onclick="withdraw()">Retirer</button>
</div>

<div class="stage">
  <div class="glass-card">
    <div class="title">Choisissez votre pari</div>
    <div class="choices">
      <div class="choice" onclick="setChoice('moins')">Moins de 7</div>
      <div class="choice" onclick="setChoice('egal')">Égal 7</div>
      <div class="choice" onclick="setChoice('plus')">Plus de 7</div>
    </div>
    <input type="number" id="bet" value="200" min="200" max="150000">
    <button onclick="play()">▶ Lancer</button>
    <div class="result" id="result"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
let user = JSON.parse(localStorage.getItem("user"));
if(!user) location.href="login.html";
document.getElementById("balance").innerText = user.balance;
let choice=null;

function toggleMenu(){document.getElementById("menu").classList.toggle("active");}
function setChoice(c){choice=c;document.querySelectorAll('.choice').forEach(el=>el.classList.remove('active'));event.target.closest('.choice').classList.add('active');}

function showToast(msg){
  const toast = document.getElementById("toast");
  toast.innerText = msg;
  toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"),2500);
}

function play(){
  const bet=Number(document.getElementById("bet").value);
  if(!choice){showToast("Choisissez un pari"); return;}
  if(bet<200||bet>150000){showToast("Mise invalide"); return;}
  if(bet>user.balance){showToast("Solde insuffisant"); return;}
  fetch("/api/play",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({userId:user.id,bet,choice})})
  .then(r=>r.json()).then(d=>{
    if(d.error) return showToast(d.error);
    user.balance=d.balance;
    localStorage.setItem("user",JSON.stringify(user));
    document.getElementById("balance").innerText=user.balance;
    showToast(d.win?"Gagné !":"Perdu !");
    document.getElementById("result").innerText=`🎲 ${d.d1}+${d.d2}=${d.sum}`;
  });
}

function deposit(){
  const amount = Number(document.getElementById("depositAmount").value);
  if(amount<1000){showToast("Montant minimum 1000 XAF"); return;}
  fetch("/api/moneyfusion/deposit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({userId:user.id,amount})})
  .then(r=>r.json()).then(d=>{
    if(d.error) return showToast(d.error);
    user.balance += amount;
    user.totalDeposit = (user.totalDeposit||0)+amount;
    localStorage.setItem("user", JSON.stringify(user));
    document.getElementById("balance").innerText=user.balance;
    showToast("Dépôt effectué !");
  });
}

function withdraw(){
  const amount = Number(document.getElementById("withdrawAmount").value);
  if(amount > user.balance){showToast("Solde insuffisant"); return;}
  if(amount < (user.totalDeposit||0)*2){showToast(`Retrait min = double dépôt (${(user.totalDeposit||0)*2})`); return;}
  fetch("/api/moneyfusion/withdraw",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({userId:user.id,amount})})
  .then(r=>r.json()).then(d=>{
    if(d.error) return showToast(d.error);
    user.balance -= amount;
    localStorage.setItem("user",JSON.stringify(user));
    document.getElementById("balance").innerText=user.balance;
    showToast("Retrait effectué !");
  });
}

// --- Particles animation ---
const canvas=document.getElementById('particles');
const ctx=canvas.getContext('2d');
let w=canvas.width=window.innerWidth;
let h=canvas.height=window.innerHeight;
window.addEventListener('resize',()=>{w=canvas.width=window.innerWidth;h=canvas.height=window.innerHeight;});
const particles=[];
for(let i=0;i<120;i++){particles.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*2+1,speed:Math.random()*0.5+0.2});}
function animate(){
  ctx.clearRect(0,0,w,h);
  for(let p of particles){
    p.y-=p.speed;
    if(p.y<0)p.y=h;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle='rgba(223,255,230,0.25)';
    ctx.fill();
  }
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
