<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Jeu de Dés</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
  --bg-1: #040406;
  --bg-2: #071012;
  --neon: #dfffe6;
  --glass-alpha: 0.12;
  --glass-border: rgba(223,255,230,0.18);
  --muted: rgba(255,255,255,0.45);
  --card-w: 380px;
}
*{box-sizing:border-box;}
html,body{
  height:100%;
  margin:0;
  font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;
  background: radial-gradient(1200px 600px at 10% 10%, rgba(223,255,230,0.03), transparent),
              radial-gradient(900px 500px at 90% 85%, rgba(223,255,230,0.02), transparent),
              linear-gradient(180deg,var(--bg-1),var(--bg-2));
  color:#dfffe6;
  overflow:hidden;
}
#particles{position:fixed;inset:0;width:100%;height:100%;z-index:0;}
.stage{
  position:relative;height:100vh;
  display:flex;align-items:center;justify-content:center;padding:36px; z-index:1;
}
.glass-card{
  width:var(--card-w);max-width:92vw;
  background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
  border-radius:18px;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,0.7), 0 0 40px rgba(223,255,230,0.05) inset;
  backdrop-filter: blur(10px) saturate(140%);
  border:1px solid var(--glass-border);position:relative;overflow:hidden;text-align:center;
}
.title{font-family:"JetBrains Mono",monospace;font-size:16px;color:var(--neon);margin-bottom:12px;}
button{width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(180deg, rgba(223,255,230,0.06), rgba(223,255,230,0.02));color:var(--neon);font-family:"JetBrains Mono",monospace;font-size:16px;margin-top:12px;cursor:pointer;}
input{width:100%;padding:12px;border-radius:10px;border:1px solid rgba(223,255,230,0.06);background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.006));color:#eafff2;margin-bottom:10px;}
.result{margin-top:10px;font-weight:bold;}
.choices{display:flex;justify-content:space-between;margin-bottom:10px;}
.choice{width:32%;padding:10px;border-radius:10px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.006));cursor:pointer;text-align:center;}
.choice.active{border:2px solid var(--neon);}

/* Menu burger */
.menu-btn{
  position:fixed;top:20px;right:20px;font-size:24px;cursor:pointer;z-index:10;
}
.menu{
  position:fixed;top:0;right:-220px;width:200px;height:100%;background:rgba(0,0,0,0.5);backdrop-filter:blur(8px);padding:20px;transition:right .3s;z-index:9;border-left:1px solid rgba(223,255,230,0.2);border-radius:10px 0 0 10px;}
.menu.active{right:0;}
.menu h3{color:var(--neon);margin-top:0;font-family:"JetBrains Mono",monospace;margin-bottom:10px;}
.menu button{margin-bottom:10px;}
</style>
</head>
<body>
<canvas id="particles"></canvas>

<div class="menu-btn" onclick="toggleMenu()">☰</div>
<div class="menu" id="menu">
  <h3>Compte</h3>
  <div>Solde: <span id="balance">0</span> XAF</div>
  <button onclick="deposit()">Dépôt</button>
  <button onclick="withdraw()">Retrait</button>
</div>

<div class="stage">
  <div class="glass-card">
    <div class="title">Choisissez votre pari</div>
    <div class="choices">
      <div class="choice" onclick="setChoice('moins', event)">Moins de 7</div>
      <div class="choice" onclick="setChoice('egal', event)">Égal 7</div>
      <div class="choice" onclick="setChoice('plus', event)">Plus de 7</div>
    </div>
    <input type="number" id="bet" value="200" min="200" max="150000">
    <button onclick="play()">▶ Lancer</button>
    <div class="result" id="result"></div>
  </div>
</div>

<script>
let user = JSON.parse(localStorage.getItem("user"));
if(!user) location.href="login.html";
document.getElementById("balance").innerText = user.balance;
let choice=null;

function toggleMenu(){
  document.getElementById("menu").classList.toggle("active");
}

function setChoice(c,event){
  choice=c;
  document.querySelectorAll('.choice').forEach(el=>el.classList.remove('active'));
  event.currentTarget.classList.add('active');
}

function play(){
  const bet=Number(document.getElementById("bet").value);
  if(!choice){alert("Choisissez un pari");return;}
  if(bet<200 || bet>150000){alert("Mise invalide");return;}
  if(bet>user.balance){alert("Solde insuffisant");return;}
  
  fetch("/api/play",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({userId:user.id,bet,choice})
  })
  .then(r=>r.json())
  .then(d=>{
    if(d.error){alert(d.error); return;}
    user.balance=d.balance;
    localStorage.setItem("user",JSON.stringify(user));
    document.getElementById("balance").innerText=user.balance;
    document.getElementById("result").innerText=`🎲 ${d.d1}+${d.d2}=${d.sum} → ${d.win?"GAGNÉ!":"PERDU!"}`;
  });
}

function deposit(){
  const amount = Number(prompt("Montant dépôt min 1000 XAF"));
  if(amount < 1000){alert("Montant min 1000 XAF"); return;}
  fetch("/api/moneyfusion/deposit",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({userId:user.id,amount})
  }).then(r=>r.json()).then(d=>{
    if(d.error){alert(d.error); return;}
    user.balance += amount;
    localStorage.setItem("user",JSON.stringify(user));
    document.getElementById("balance").innerText=user.balance;
    alert("Dépôt effectué !");
  });
}

function withdraw(){
  const amount = Number(prompt("Montant retrait (double du dépôt)"));
  fetch("/api/moneyfusion/withdraw",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({userId:user.id,amount})
  }).then(r=>r.json()).then(d=>{
    if(d.error){alert(d.error); return;}
    user.balance -= amount;
    localStorage.setItem("user",JSON.stringify(user));
    document.getElementById("balance").innerText=user.balance;
    alert("Retrait effectué !");
  });
}

// PARTICLES
const canvas=document.getElementById('particles');
const ctx=canvas.getContext('2d');
let w=canvas.width=window.innerWidth;
let h=canvas.height=window.innerHeight;
window.addEventListener('resize',()=>{w=canvas.width=window.innerWidth;h=canvas.height=window.innerHeight;});
const particles=[];
for(let i=0;i<120;i++){particles.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*2+1,speed:Math.random()*0.5+0.2});}
function animate(){
  ctx.clearRect(0,0,w,h);
  for(let p of particles){
    p.y-=p.speed;
    if(p.y<0)p.y=h;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle='rgba(223,255,230,0.25)';
    ctx.fill();
  }
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
