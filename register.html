<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Inscription</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
  --bg-1: #040406;
  --bg-2: #071012;
  --neon: #dfffe6;
  --glass-alpha: 0.12;
  --glass-border: rgba(223,255,230,0.18);
  --muted: rgba(255,255,255,0.45);
  --card-w: 380px;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;
background: radial-gradient(1200px 600px at 10% 10%, rgba(223,255,230,0.03), transparent),
            radial-gradient(900px 500px at 90% 85%, rgba(223,255,230,0.02), transparent),
            linear-gradient(180deg,var(--bg-1),var(--bg-2));
color:#dfffe6;overflow:hidden;display:flex;justify-content:center;align-items:center;}

#particles{position:fixed;inset:0;width:100%;height:100%;z-index:0;}
.stage{position:relative;height:100vh;display:flex;align-items:center;justify-content:center;padding:36px; z-index:1;}
.glass-card{
  width:var(--card-w);max-width:92vw;
  background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
  border-radius:18px;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,0.7), 0 0 40px rgba(223,255,230,0.05) inset;
  backdrop-filter: blur(10px) saturate(140%);
  border:1px solid var(--glass-border);position:relative;overflow:hidden;text-align:left;
}
.card-header h1{font-family:"JetBrains Mono",monospace;font-size:16px;margin:0;color:var(--neon);text-transform:uppercase;text-shadow:0 0 18px rgba(223,255,230,0.22);}
.card-body{margin-top:14px;display:flex;flex-direction:column;gap:12px;}
input[type="text"], input[type="password"]{
  height:46px;border-radius:10px;border:1px solid rgba(223,255,230,0.06);
  padding:0 12px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.006));
  color:#eafff2;outline:none;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,0.5);
  transition:box-shadow .18s, transform .12s;
}
input::placeholder{color:rgba(223,255,230,0.22);}
input:focus{box-shadow:0 8px 30px rgba(223,255,230,0.06);transform:translateY(-1px);border-color:var(--neon);}
.attack-btn{position:relative;width:100%;height:64px;border-radius:12px;border:0;cursor:pointer;overflow:visible;
background:linear-gradient(180deg, rgba(223,255,230,0.06), rgba(223,255,230,0.02));
display:flex;align-items:center;justify-content:center;font-family:"JetBrains Mono",monospace;
letter-spacing:2px;color:var(--neon);font-size:18px;text-transform:uppercase;
box-shadow:0 10px 40px rgba(0,0,0,0.035), 0 6px 18px rgba(0,0,0,0.6);
transition:transform .12s, filter .12s;}
.attack-btn:active{transform:translateY(2px) scale(.999);}
.attack-btn[disabled]{opacity:0.6; cursor:not-allowed; filter:grayscale(.2);}
a{color:var(--neon);text-decoration:none;font-size:14px;text-align:center;margin-top:10px;display:block;}
a:hover{text-decoration:underline;}
</style>
</head>
<body>
<canvas id="particles"></canvas>
<div class="stage">
  <div class="glass-card">
    <div class="card-header"><h1>Inscription</h1></div>
    <div class="card-body">
      <input id="u" type="text" placeholder="Nom d'utilisateur">
      <input id="p" type="password" placeholder="Mot de passe">
      <button class="attack-btn" onclick="reg()">Créer</button>
      <a href="login.html">Connexion</a>
    </div>
  </div>
</div>

<script>
function reg(){
  const username=document.getElementById('u').value;
  const password=document.getElementById('p').value;
  if(!username||!password){alert("Remplissez tous les champs");return;}
  fetch("/api/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,password})})
  .then(r=>r.json()).then(()=>location.href="login.html");
}

// PARTICLES
const canvas=document.getElementById('particles');
const ctx=canvas.getContext('2d');
let w=canvas.width=window.innerWidth;
let h=canvas.height=window.innerHeight;
window.addEventListener('resize',()=>{w=canvas.width=window.innerWidth;h=canvas.height=window.innerHeight;});
const particles=[];
for(let i=0;i<120;i++){particles.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*2+1,speed:Math.random()*0.5+0.2});}
function animate(){
  ctx.clearRect(0,0,w,h);
  for(let p of particles){
    p.y-=p.speed;
    if(p.y<0)p.y=h;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle='rgba(223,255,230,0.25)';
    ctx.fill();
  }
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
