<!DOCTYPE html>
<html>
<head>
  <title>Secret Story - Register</title>
  <meta charset="UTF-8" />
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>
<body style="background:#111;color:#fff;font-family:'Montserrat',sans-serif;">
  <div id="root"></div>

  <script type="text/babel">
    const {useState} = React;

    function Register() {
      const [username,setUsername] = useState("");
      const [password,setPassword] = useState("");
      const [msg,setMsg] = useState("");

      const handleRegister = async () => {
        if(!username || !password) return setMsg("Remplis tous les champs !");
        const res = await fetch("/api/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,password})});
        const data = await res.json();
        if(data.error) return setMsg(data.error);
        setMsg("Compte créé avec succès !");
        setTimeout(()=>{ location="/login.html"; },1500);
      }

      return (
        <div style={containerStyle}>
          <h1 style={{color:"#ff4081"}}>Créer un compte</h1>
          <input placeholder="Username" value={username} onChange={e=>setUsername(e.target.value)} style={inputStyle} /><br/>
          <input type="password" placeholder="Password" value={password} onChange={e=>setPassword(e.target.value)} style={inputStyle} /><br/>
          <button onClick={handleRegister} style={btnStyle}>S'inscrire</button>
          <p style={{marginTop:"15px",color:"#18ffff"}}>{msg}</p>
          <p><a href="/login.html" style={{color:"#18ffff"}}>Connexion</a></p>
        </div>
      );
    }

    const containerStyle={background:"#1c1c1c",padding:"50px",borderRadius:"20px",maxWidth:"500px",margin:"50px auto",textAlign:"center",boxShadow:"0 0 20px rgba(255,64,129,0.3)"};
    const inputStyle={padding:"15px", fontSize:"1.5em", margin:"10px 0", width:"80%", borderRadius:"10px", border:"none", background:"#222", color:"#fff", textAlign:"center"};
    const btnStyle={padding:"15px 30px", fontSize:"1.5em", margin:"10px", borderRadius:"10px", border:"none", background:"#ff4081", color:"#fff", cursor:"pointer"};

    ReactDOM.render(<Register />, document.getElementById("root"));
  </script>
</body>
</html>
