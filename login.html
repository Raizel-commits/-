<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Connexion</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { background: radial-gradient(circle,#2b2f44,#141625); color:white; font-family:Arial; height:100vh; margin:0; display:flex; justify-content:center; align-items:center; position:relative; }
#bg-cat { position:absolute; top:10%; left:-150px; width:150px; height:150px; background:url('assets/cat.png') no-repeat center/contain; animation: moveCat 15s linear infinite; opacity:0.2; z-index:0; }
@keyframes moveCat { 0% { left:-200px; } 50% { left:80%; } 100% { left:100%; } }
.box { background: rgba(28,31,51,0.95); padding:25px; border-radius:20px; width:320px; text-align:center; z-index:1; box-shadow:0 0 25px rgba(0,0,0,0.7);}
h2 { margin-bottom:20px;}
input { width:100%; padding:12px; margin:10px 0; border-radius:12px; border:none; font-size:16px; box-sizing:border-box;}
button { width:100%; padding:12px; margin-top:10px; border-radius:12px; border:none; background:linear-gradient(135deg,#4caf50,#66bb6a); color:white; font-size:16px; cursor:pointer; transition: transform 0.2s, box-shadow 0.2s;}
button:hover { transform:scale(1.05); box-shadow:0 0 15px rgba(0,255,0,0.5);}
a { color:gold; text-decoration:none; font-size:14px; display:block; margin-top:10px; transition:color 0.2s;}
a:hover { color:#FFD700; }
</style>
</head>
<body>
<div id="bg-cat"></div>
<div class="box">
<h2>Connexion</h2>
<input id="u" placeholder="Nom d'utilisateur">
<input id="p" type="password" placeholder="Mot de passe">
<button onclick="login()">Connexion</button>
<a href="register.html">Créer un compte</a>
</div>
<script>
function login(){
  const username = document.getElementById('u').value;
  const password = document.getElementById('p').value;
  if(!username || !password){ alert("Remplissez tous les champs"); return; }
  fetch("/api/login",{method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({username,password})})
  .then(r=>r.json()).then(d=>{
    if(d.error) alert(d.error);
    else { localStorage.setItem('user', JSON.stringify(d)); location.href="game.html"; }
  });
}
</script>
</body>
</html>
