<!DOCTYPE html>
<html>
<head>
  <title>Secret Story - Login</title>
  <style>
    @keyframes gradient {0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
    body {margin:0;font-family:'Segoe UI',sans-serif;height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(270deg,#18ffff,#7c4dff,#ff4081);background-size:600% 600%;animation:gradient 20s ease infinite;color:#fff;text-align:center;}
    .container {background:rgba(0,0,0,0.7);padding:50px;border-radius:20px;width:90%;max-width:500px;}
    h1 {font-size:3em;margin-bottom:30px;color:#18ffff;}
    input {font-size:1.5em;padding:15px;margin:10px 0;width:80%;border-radius:10px;border:none;text-align:center;background:#222;color:#fff;}
    button {font-size:1.5em;padding:15px 30px;margin:10px;border-radius:10px;border:none;background:#ff4081;color:#fff;cursor:pointer;transition:0.3s;}
    button:hover {background:#e91e63;}
    a {color:#ff4081;text-decoration:none;}
  </style>
</head>
<body>
  <div class="container">
    <h1>Connexion</h1>
    <input id="email" placeholder="Email"><br>
    <input id="password" type="password" placeholder="Password"><br>
    <button onclick="login()">Se connecter</button><br>
    <p>Pas encore de compte ? <a href="/register.html">S'inscrire</a></p>
  </div>

  <script>
    async function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      if(!email||!password) return alert("Remplis tous les champs !");
      const res = await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password})});
      const data = await res.json();
      if(data.error) return alert(data.error);
      localStorage.token = data.token;
      localStorage.username = data.username;
      location="/dashboard";
    }
  </script>
</body>
</html>
