<!DOCTYPE html>
<html>
<head>
  <title>Secret Story - Login</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap');
    body {
      margin:0;
      font-family:'Montserrat',sans-serif;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#111;
      color:#fff;
    }
    .container {
      background:#1c1c1c;
      padding:50px;
      border-radius:20px;
      width:90%;
      max-width:400px;
      box-shadow:0 0 20px rgba(255,64,129,0.3);
      text-align:center;
    }
    h1 {font-size:2.5em;margin-bottom:30px;color:#ff4081;}
    input {
      font-size:1.1em;
      padding:12px;
      margin:10px 0;
      width:90%;
      border-radius:10px;
      border:none;
      background:#222;
      color:#fff;
      text-align:center;
    }
    button {
      font-size:1.1em;
      padding:12px 25px;
      margin-top:15px;
      border-radius:10px;
      border:none;
      background:#ff4081;
      color:#fff;
      cursor:pointer;
      transition:0.3s;
    }
    button:hover {background:#e91e63;}
    a {color:#18ffff;text-decoration:none;}
    #msg {
      font-size:1em;
      color:#ff4081;
      margin-top:15px;
      min-height:1.5em;
      opacity:0;
      transition:opacity 0.5s;
    }
    #msg.show {opacity:1;}
  </style>
</head>
<body>
  <div class="container">
    <h1>Connexion</h1>
    <input id="username" placeholder="Username"><br>
    <input id="password" type="password" placeholder="Password"><br>
    <button onclick="login()">Se connecter</button><br>
    <p>Pas encore de compte ? <a href="/register.html">S'inscrire</a></p>
    <p id="msg"></p>
  </div>

  <script>
    const msgEl = document.getElementById("msg");

    function showMessage(text){
      msgEl.innerText=text;
      msgEl.classList.add("show");
      setTimeout(()=>msgEl.classList.remove("show"),3000);
    }

    async function login(){
      const username=document.getElementById("username").value;
      const password=document.getElementById("password").value;
      if(!username||!password) return showMessage("Remplis tous les champs !");
      
      const res=await fetch("/api/login",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({username,password})
      });
      const data=await res.json();
      if(data.error) return showMessage(data.error);

      localStorage.token=data.token;
      localStorage.username=data.username;
      showMessage("Connexion réussie !");
      setTimeout(()=>{ location="/dashboard"; },1500);
    }
  </script>
</body>
</html>
