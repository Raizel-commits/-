<!DOCTYPE html>
<html>
<head>
  <title>Secret Story - Dashboard</title>
  <meta charset="UTF-8" />
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>
<body style="background:#111;color:#fff;font-family:'Montserrat',sans-serif;">
  <div id="root"></div>

  <script type="text/babel">
    const {useState,useEffect} = React;

    function Dashboard() {
      const [messages,setMessages] = useState([]);
      const [msg,setMsg] = useState("");
      const username = localStorage.username;
      const token = localStorage.token;

      const loadInbox = async () => {
        const res = await fetch("/api/inbox",{headers:{Authorization:token}});
        const data = await res.json();
        setMessages(data);
      };

      useEffect(()=>{
        loadInbox();
        const interval = setInterval(loadInbox,5000);
        return ()=>clearInterval(interval);
      },[]);

      const copyLink = () => {
        navigator.clipboard.writeText(`${location.origin}/u/${username}`);
        setMsg("Lien copié !");
        setTimeout(()=>setMsg(""),3000);
      }

      const logout = () => {
        localStorage.clear();
        location="/login.html";
      }

      return (
        <div style={{padding:"30px", maxWidth:"800px", margin:"30px auto"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <h1 style={{color:"#ff4081"}}>Secret Story</h1>
            <button onClick={logout} style={{padding:"10px 20px",borderRadius:"10px",border:"none",background:"#ff4081",color:"#fff",cursor:"pointer"}}>Déconnexion</button>
          </div>
          <p style={{color:"#18ffff"}}>{msg}</p>
          <div style={{display:"flex",gap:"15px",marginBottom:"30px"}}>
            <input value={`${location.origin}/u/${username}`} readOnly style={{flex:1,padding:"10px",borderRadius:"10px",border:"none",background:"#222",color:"#fff",textAlign:"center"}} />
            <button onClick={copyLink} style={{padding:"10px 20px",borderRadius:"10px",border:"none",background:"#ff4081",color:"#fff"}}>Copier</button>
          </div>
          <h2>Inbox</h2>
          <div style={{display:"flex",flexDirection:"column",gap:"15px"}}>
            {messages.length===0 ? <p>Aucun message pour l'instant</p> :
              messages.map((m,i)=>
                <div key={i} style={{background:"#1c1c1c",padding:"20px",borderRadius:"15px",boxShadow:"0 0 10px rgba(24,255,255,0.3)",fontSize:"1.2em"}}>
                  {m.content}
                </div>
              )
            }
          </div>
        </div>
      );
    }

    ReactDOM.render(<Dashboard />, document.getElementById("root"));
  </script>
</body>
</html>
