<!DOCTYPE html>
<html>
<head>
  <title>Secret Story - Envoyer message</title>
  <style>
    @keyframes gradient {
      0% {background-position:0% 50%;}
      50% {background-position:100% 50%;}
      100% {background-position:0% 50%;}
    }

    body {
      margin:0;
      font-family:'Segoe UI',sans-serif;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background: linear-gradient(270deg,#ff4081,#7c4dff,#18ffff);
      background-size:600% 600%;
      animation:gradient 20s ease infinite;
      color:#fff;
      text-align:center;
    }

    .container { background:rgba(0,0,0,0.7); padding:40px; border-radius:20px; width:90%; max-width:700px; }
    h2 { font-size:2.5em; margin-bottom:20px; color:#ff4081; }
    textarea { font-size:1.8em; padding:20px; width:80%; height:150px; border-radius:15px; border:none; margin:20px 0; background:#222; color:#fff; text-align:center; resize:none; }
    button { font-size:1.8em; padding:15px 40px; border-radius:15px; border:none; background:#ff4081; color:#fff; cursor:pointer; transition:0.3s; }
    button:hover { background:#e91e63; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Envoie un message anonyme</h2>
    <textarea id="msg" placeholder="Ton message..."></textarea><br>
    <button onclick="send()">Envoyer</button>
  </div>

  <script>
    const u = location.pathname.split("/").pop();
    async function send(){
      if(!msg.value.trim()) return alert("Message vide !");
      await fetch("/api/send/"+u,{
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({ message: msg.value })
      });
      alert("Message envoyé ✅");
      msg.value="";
    }
  </script>
</body>
</html>
