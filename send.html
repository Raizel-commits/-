<!DOCTYPE html>
<html>
<head>
  <title>Secret Story - Envoyer un message</title>
  <meta charset="UTF-8" />
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>
<body style="background:#111;color:#fff;font-family:'Montserrat',sans-serif;">
  <div id="root"></div>

  <script type="text/babel">
    const {useState} = React;

    function Send() {
      const [message,setMessage] = useState("");
      const [msg,setMsg] = useState("");
      const username = location.pathname.split("/u/")[1];

      const sendMessage = async () => {
        if(!message.trim()) return setMsg("Écris quelque chose !");
        const res = await fetch(`/api/send/${username}`,{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({message})
        });
        const data = await res.json();
        if(data.error) return setMsg(data.error);
        setMsg("Message envoyé !");
        setMessage("");
        setTimeout(()=>setMsg(""),3000);
      }

      return (
        <div style={{background:"#1c1c1c",padding:"50px",borderRadius:"20px",maxWidth:"500px",margin:"50px auto",textAlign:"center"}}>
          <h1 style={{color:"#ff4081"}}>Envoyer un message</h1>
          <textarea value={message} onChange={e=>setMessage(e.target.value)} placeholder="Votre message..." style={{width:"80%",height:"150px",borderRadius:"15px",border:"none",padding:"15px",background:"#222",color:"#fff",fontSize:"1.2em"}}></textarea><br/>
          <button onClick={sendMessage} style={{marginTop:"15px", fontSize:"1.5em", padding:"15px 30px", borderRadius:"10px", border:"none", background:"#ff4081", color:"#fff"}}>Envoyer</button>
          <p style={{color:"#18ffff", marginTop:"15px"}}>{msg}</p>
        </div>
      );
    }

    ReactDOM.render(<Send />, document.getElementById("root"));
  </script>
</body>
</html>
